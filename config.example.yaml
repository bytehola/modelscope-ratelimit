# CLIProxyAPI 配置示例 — modelscope-ratelimit 插件
# 将以下段落放入 config.yaml。

openai-compatibility:
  - name: "modelscope"
    disabled: false
    base-url: "https://api-inference.modelscope.cn/v1"
    api-key-entries:
      - api-key: "ms-key-AAAAAAAAAAAA"
      - api-key: "ms-key-BBBBBBBBBBBB"
      - api-key: "ms-key-CCCCCCCCCCCC"
    models:
      - name: "Qwen/Qwen2.5-72B-Instruct"
        alias: "Qwen-72B"
      - name: "Qwen/Qwen2.5-7B-Instruct"
        alias: "Qwen-7B"

plugins:
  enabled: true
  dir: "plugins"
  # 插件商店安装：取消注释并在管理中心 → 插件商店安装
  # store-sources:
  #   - "https://raw.githubusercontent.com/bytehola/modelscope-ratelimit/main/registry.json"
  configs:
    modelscope-ratelimit:
      enabled: true
      priority: 10 # 高于其他调度器即可

      # ---- 必填 ----
      providers: ["modelscope"] # 监控的 provider 名称；顺序决定轮换顺序。示例: ["modelscope", "modelscope-ai"]
      skip_provider_on_429: false # 跳过整家：池级 insufficient_quota / 405 / 503 model_not_ready（模型还在加载）命中时换下一家；key 级失败仍在本家内换 key。
      use_responses: "*" # 填上游模型 name（不是 alias）：
      #   "*" 或 "true"        全部模型走 Responses
      #   "false" / 留空 / 删除   关闭（任意匹配不到模型的字符串等同关闭）
      #   "Qwen/Qwen2.5-72B-Instruct"          仅该模型
      #   '["Qwen/A", "Qwen/B"]' 或 "Qwen/A, Qwen/B"  多模型
      host_base_url: "http://127.0.0.1:8317" # CPA 管理 API 地址，默认 127.0.0.1:8317
      management_key: "your-management-secret" # CPA 管理密钥，仅服务端使用

      # ---- 凭据与退避 ----
      credential_strategy: "round-robin" # round-robin（轮询）| fill-first（填充优先）
      insufficient_quota_cooldown: 0.1 # 退避基准秒数，×2 递增封顶 60s，无抖动；0 = 跳过冷却立即轮换
      timezone: "Asia/Shanghai" # 每日 00:00 重置时区


      # ---- 可选 ----
      # ms_proxy_url: "http://127.0.0.1:8888" # 调试用 Modelscope API 代理，留空=直连
